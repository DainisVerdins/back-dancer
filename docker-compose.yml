services:
  postgres:
    image: postgres:16-alpine
    container_name: petspets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petspets
      POSTGRES_PASSWORD: petspets_dev_password
      POSTGRES_DB: petspets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petspets -d petspets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: